<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Live Parlays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090a0c;
    --card: #121418;
    --card-border: rgba(255, 255, 255, 0.07);
    --text: #f4f4f6;
    --muted: #8a8f98;
    --green: #10b981;
    --green-bg: rgba(16, 185, 129, 0.12);
    --yellow: #f59e0b;
    --yellow-bg: rgba(245, 158, 11, 0.12);
    --red: #ef4444;
    --red-bg: rgba(239, 68, 68, 0.12);
    --pre: #64748b;
    --pre-bg: rgba(100, 116, 139, 0.12);
    --accent: #3b82f6;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    scrollbar-width: none;
  }
  *::-webkit-scrollbar { display: none; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body { padding: 12px 12px 44px; }
  .wrap { max-width: 480px; margin: 0 auto; }

  /* Top System Switcher Bar */
  .sys-nav {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    background: #111317;
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
  }
  .sys-link {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 11.5px;
    font-weight: 600;
    padding: 7px 8px;
    border-radius: 7px;
    color: var(--muted);
    transition: all 0.15s ease;
  }
  .sys-link.active {
    background: #1d222b;
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.35);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .header-left {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .sync-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }
  .dot.loading {
    background: var(--yellow);
    box-shadow: 0 0 8px var(--yellow);
  }
  .bet-summary {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: #e2e8f0;
  }
  .profit-chip {
    display: inline-flex;
    align-items: center;
    padding: 2px 7px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 700;
  }
  .profit-chip.pos {
    background: var(--green-bg);
    color: var(--green);
    border: 1px solid rgba(16, 185, 129, 0.35);
  }
  .profit-chip.neg {
    background: var(--red-bg);
    color: var(--red);
    border: 1px solid rgba(239, 68, 68, 0.35);
  }

  .date-nav {
    display: inline-flex;
    align-items: center;
    background: #111317;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
  }
  .date-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 7px;
    padding: 6px 10px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .date-btn.active {
    background: #1b1f27;
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }

  /* Parlay Grid Selector (2x3 Grid for 6 Parlays) */
  .parlay-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .p-pill {
    border: 1px solid var(--card-border);
    background: #111318;
    color: var(--muted);
    border-radius: 10px;
    padding: 8px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }
  .p-pill.active {
    background: #1b202a;
    color: var(--text);
    border-color: rgba(255,255,255,0.22);
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
  }
  .p-pill.won {
    border-color: rgba(16, 185, 129, 0.45);
    background: rgba(16, 185, 129, 0.08);
  }
  .p-pill-title {
    font-size: 11.5px;
    font-weight: 700;
    color: inherit;
  }
  .p-pill-sub {
    font-size: 10px;
    font-weight: 600;
    opacity: 0.85;
  }

  .ticket-banner {
    background: linear-gradient(180deg, #151921 0%, #11141a 100%);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .ticket-title {
    font-size: 12.5px;
    font-weight: 700;
    color: #f8fafc;
  }
  .ticket-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .ticket-payout {
    font-size: 12px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 8px;
    background: var(--green-bg);
    color: var(--green);
    border: 1px solid rgba(16, 185, 129, 0.3);
    white-space: nowrap;
  }

  .leg-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 13px;
    padding: 11px 12px;
    margin-bottom: 8px;
  }
  .leg-card.status-hit {
    border-color: rgba(16, 185, 129, 0.35);
    background: linear-gradient(180deg, rgba(16, 185, 129, 0.06) 0%, #121418 100%);
  }
  .leg-card.status-red {
    border-color: rgba(239, 68, 68, 0.35);
  }
  .game-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    padding-bottom: 5px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  .score-box {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 6px #10b981;
  }
  .row-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }
  .player-name {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
  }
  .team-tag {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }
  .pill {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 99px;
    white-space: nowrap;
  }
  .pill-hit, .pill-green { background: var(--green-bg); color: var(--green); }
  .pill-yellow { background: var(--yellow-bg); color: var(--yellow); }
  .pill-red { background: var(--red-bg); color: var(--red); }
  .pill-pre { background: var(--pre-bg); color: #94a3b8; }

  .row-mid {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    margin: 6px 0 7px;
  }
  .prop-name { color: #cbd5e1; font-weight: 600; }
  .stat-nums { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }

  .bar-container {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .bar-track {
    position: relative;
    flex: 1;
    height: 8px;
    background: rgba(255, 255, 255, 0.07);
    border-radius: 99px;
    overflow: visible;
  }
  .bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.35s ease;
  }
  .fill-hit, .fill-green { background: var(--green); }
  .fill-yellow { background: var(--yellow); }
  .fill-red { background: var(--red); }
  .fill-pre { background: var(--pre); }
  .bar-knob {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    min-width: 20px;
    height: 18px;
    padding: 0 5px;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e2430;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .knob-hit { background: var(--green); color: #052e16; border-color: #34d399; }
  .bar-target {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    min-width: 24px;
    text-align: right;
  }
  .bar-target.target-hit { color: var(--green); }
</style>
</head>

let activeDate = "2026-11-09";
let activeParlayId = "P1";

const ESPN_SPORT_PATH = {
  NBA: 'basketball/nba',
  NHL: 'hockey/nhl',
  NFL: 'football/nfl',
};

const TEAM_ALIAS = {
  WAS: 'WSH', WSH: 'WSH',
  GSW: 'GS', GS: 'GS',
  NOP: 'NO', NO: 'NO',
  NYK: 'NY', NY: 'NY',
  SAS: 'SA', SA: 'SA',
  UTA: 'UTAH', UTAH: 'UTAH',
  TBL: 'TB', TB: 'TB',
  NJD: 'NJ', NJ: 'NJ',
  LAK: 'LA', LA: 'LA',
  SJS: 'SJ', SJ: 'SJ',
};

function normTeam(sp, abbr) {
  const u = String(abbr || '').toUpperCase().trim();
  return TEAM_ALIAS[u] || u;
}

function normPlayerName(s) {
  return String(s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9 ]/g, '')
    .replace(/\b(jr|sr|ii|iii|iv)\b/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function selectDate(dt) {
  activeDate = dt;
  activeParlayId = "P1";
  document.getElementById('btn-sun').classList.toggle('active', dt === '2026-11-08');
  document.getElementById('btn-mon').classList.toggle('active', dt === '2026-11-09');
  render();
  if (dt === '2026-11-09') pollESPN();
}

function selectParlay(pid) {
  activeParlayId = pid;
  render();
}

async function pollESPN() {
  const dayObj = STORE[activeDate];
  if (!dayObj || dayObj.settled_permanent) return;
  const dot = document.getElementById('sync-dot');
  if (dot) dot.classList.add('loading');

  const ymd = activeDate.replace(/-/g, '');
  const allLegs = [];
  dayObj.parlays.forEach(p => p.legs.forEach(l => allLegs.push(l)));

  const sportsNeeded = [...new Set(allLegs.map(l => l.raw_sport))];
  const gameMap = {};
  const playerByName = {};

  for (const sp of sportsNeeded) {
    try {
      const sbUrl = `https://site.api.espn.com/apis/site/v2/sports/${ESPN_SPORT_PATH[sp]}/scoreboard?dates=${ymd}&t=${Date.now()}`;
      const sbRes = await fetch(sbUrl);
      if (!sbRes.ok) continue;
      const sbJson = await sbRes.json();
      const events = sbJson.events || [];
      const activeEvents = [];

      for (const ev of events) {
        const comp = (ev.competitions || [])[0];
        if (!comp) continue;
        const stType = comp.status?.type || {};
        const state = stType.state || 'pre';
        const shortDetail = stType.shortDetail || 'Scheduled';
        const competitors = comp.competitors || [];
        if (competitors.length < 2) continue;
        const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
        const away = competitors.find(c => c.homeAway === 'away') || competitors[1];
        const hAbbr = normTeam(sp, home.team?.abbreviation);
        const aAbbr = normTeam(sp, away.team?.abbreviation);
        const hScore = Number(home.score || 0);
        const aScore = Number(away.score || 0);
        const scoreStr = state === 'pre'
          ? `${aAbbr} @ ${hAbbr}`
          : `${aAbbr} ${aScore} - ${hScore} ${hAbbr}`;
        const clockLbl = state === 'post' ? 'Final' : (state === 'pre' ? `Starts ${shortDetail.split(' - ').pop()}` : shortDetail);

        gameMap[`${sp}_${hAbbr}`] = { state, clock: clockLbl, scoreStr };
        gameMap[`${sp}_${aAbbr}`] = { state, clock: clockLbl, scoreStr };

        if (state === 'in' || state === 'post') {
          activeEvents.push(ev.id);
        }
      }

      for (const evId of activeEvents) {
        try {
          const sumUrl = `https://site.api.espn.com/apis/site/v2/sports/${ESPN_SPORT_PATH[sp]}/summary?event=${evId}&t=${Date.now()}`;
          const sumRes = await fetch(sumUrl);
          if (!sumRes.ok) continue;
          const sumJson = await sumRes.json();
          const pGroups = sumJson.boxscore?.players || [];
          for (const pg of pGroups) {
            for (const stGrp of (pg.statistics || [])) {
              const labels = (stGrp.labels || []).map(x => String(x).toUpperCase());
              const catName = String(stGrp.name || '').toLowerCase();
              for (const ath of (stGrp.athletes || [])) {
                const disp = ath.athlete?.displayName || '';
                const nKey = `${sp}_${normPlayerName(disp)}`;
                if (!playerByName[nKey]) playerByName[nKey] = {};
                const stats = ath.stats || [];
                const getVal = (lbl) => {
                  const idx = labels.indexOf(lbl);
                  if (idx < 0 || idx >= stats.length) return 0;
                  const raw = String(stats[idx]);
                  if (raw.includes('-')) return Number(raw.split('-')[0]) || 0;
                  return Number(raw) || 0;
                };
                if (sp === 'NBA') {
                  const pts = getVal('PTS');
                  const reb = getVal('REB');
                  const ast = getVal('AST');
                  playerByName[nKey].PTS = pts;
                  playerByName[nKey].REB = reb;
                  playerByName[nKey].AST = ast;
                  playerByName[nKey].PR = pts + reb;
                  playerByName[nKey].PA = pts + ast;
                  playerByName[nKey].RA = reb + ast;
                  playerByName[nKey].PRA = pts + reb + ast;
                } else if (sp === 'NHL') {
                  if (catName === 'goalies') continue;
                  const g = getVal('G');
                  const a = getVal('A');
                  const sog = getVal('S');
                  playerByName[nKey].AST = a;
                  playerByName[nKey].PTS = g + a;
                  playerByName[nKey].SOG = sog;
                } else if (sp === 'NFL') {
                  if (catName === 'passing') playerByName[nKey].PASSYDS = getVal('YDS');
                  else if (catName === 'rushing') playerByName[nKey].RUSHYDS = getVal('YDS');
                  else if (catName === 'receiving') {
                    playerByName[nKey].REC = getVal('REC');
                    playerByName[nKey].RECYDS = getVal('YDS');
                  }
                }
              }
            }
          }
        } catch (e) {}
      }
    } catch (e) {}
  }

  let dayNet = 0;
  for (const p of dayObj.parlays) {
    for (const l of p.legs) {
      const sp = l.raw_sport;
      const tm = normTeam(sp, l.raw_team);
      const opp = normTeam(sp, l.raw_opp);
      const gInfo = gameMap[`${sp}_${tm}`] || gameMap[`${sp}_${opp}`];
      if (!gInfo) continue;

      l.game_state = gInfo.state;
      l.game_clock = gInfo.clock;
      l.game_score = gInfo.scoreStr;

      let pKey = `${sp}_${normPlayerName(l.raw_player)}`;
      if (l.raw_player === 'Alex Sarr' && !playerByName[pKey]) {
        pKey = `${sp}_${normPlayerName('Alexandre Sarr')}`;
      }
      const pStats = playerByName[pKey];
      const curVal = pStats && pStats[l.raw_stat] !== undefined ? Number(pStats[l.raw_stat]) : 0;
      const tgt = Number(l.target);

      if (gInfo.state !== 'pre') {
        l.current = curVal;
        l.sub_stat = `${curVal} / ${tgt}+ ${l.raw_stat}`;
      }

      if (gInfo.state === 'pre') {
        l.status = 'pre';
        l.badge = 'Upcoming';
        l.pct = 0;
        l.risk_tier = 4;
      } else {
        l.remaining = Math.max(0, tgt - curVal);
        l.pct = Math.min(100, Math.round((curVal / Math.max(1, tgt)) * 1000) / 10);
        if (curVal >= tgt) {
          l.status = 'hit';
          l.badge = 'Hit';
          l.risk_tier = 6;
        } else if (gInfo.state === 'post') {
          l.status = 'red';
          l.badge = 'Missed';
          l.risk_tier = 5;
        } else {
          l.status = 'green';
          l.badge = `${l.remaining} to go`;
          l.risk_tier = 2;
        }
      }
    }

    const hits = p.legs.filter(l => l.status === 'hit').length;
    const missed = p.legs.some(l => l.status === 'red' && l.game_state === 'post');
    if (hits === p.legs.length) {
      p.net_val = Math.round((p.to_return - p.risk_val) * 100) / 100;
      p.profit_str = `WON +$${p.net_val.toFixed(2)}`;
      dayNet += p.net_val;
    } else if (missed) {
      p.net_val = -p.risk_val;
      p.profit_str = `-$${p.risk_val.toFixed(2)}`;
      dayNet -= p.risk_val;
    } else {
      p.net_val = 0;
      p.profit_str = `To Win +$${(p.to_return - p.risk_val).toFixed(2)}`;
    }
  }

  dayObj.day_net = Math.round(dayNet * 100) / 100;
  dayObj.updated_at = 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  if (dot) dot.classList.remove('loading');
  render();
}

function render() {
  const dayObj = STORE[activeDate];
  if (!dayObj) return;

  const st = document.getElementById('sync-text');
  if (st) st.innerText = dayObj.updated_at;

  const bs = document.getElementById('bet-summary');
  if (bs) {
    const net = Number(dayObj.day_net || 0);
    const sign = net >= 0 ? '+' : '-';
    const cls = net >= 0 ? 'pos' : 'neg';
    bs.innerHTML = `<span>$${dayObj.day_risk.toFixed(2)} Risk</span><span class="profit-chip ${cls}">${sign}$${Math.abs(net).toFixed(2)} Net</span>`;
  }

  const grid = document.getElementById('parlay-grid');
  if (grid) {
    grid.style.gridTemplateColumns = dayObj.parlays.length === 1 ? '1fr' : 'repeat(3, 1fr)';
    grid.innerHTML = dayObj.parlays.map(p => {
      const hits = p.legs.filter(l => l.status === 'hit').length;
      const isWon = hits === p.legs.length;
      return `
        <button class="p-pill ${activeParlayId === p.id ? 'active' : ''} ${isWon ? 'won' : ''}" onclick="selectParlay('${p.id}')">
          <span class="p-pill-title">${p.short_tab}</span>
          <span class="p-pill-sub">${hits}/${p.legs.length} Legs Hit</span>
        </button>
      `;
    }).join('');
  }

  const parlay = dayObj.parlays.find(p => p.id === activeParlayId) || dayObj.parlays[0];
  const banner = document.getElementById('ticket-banner');
  if (banner && parlay) {
    const hits = parlay.legs.filter(l => l.status === 'hit').length;
    banner.innerHTML = `
      <div class="ticket-banner">
        <div>
          <div class="ticket-title">${parlay.name}</div>
          <div class="ticket-sub">${hits} of ${parlay.legs.length} Legs Hit • Zero-Overlap Verified</div>
        </div>
        <div class="ticket-payout">${parlay.profit_str}</div>
      </div>
    `;
  }

  const content = document.getElementById('content');
  if (content && parlay) {
    const sorted = [...parlay.legs].sort((a, b) => (a.risk_tier - b.risk_tier) || (a.start_order - b.start_order));
    content.innerHTML = sorted.map(l => {
      const isLive = l.game_state === 'in';
      const pctNum = l.status === 'pre' ? 0 : Math.min(100, Math.max(0, l.pct));
      const knobPos = Math.min(96, Math.max(4, pctNum));
      return `
        <div class="leg-card status-${l.status}">
          <div class="game-strip">
            <div class="score-box">
              ${isLive ? '<span class="live-dot"></span>' : ''}
              <span>${l.game_score}</span>
            </div>
            <span>${l.game_clock}</span>
          </div>
          <div class="row-top">
            <div>
              <div class="player-name">${l.player}</div>
              <div class="team-tag">${l.team}</div>
            </div>
            <span class="pill pill-${l.status}">${l.badge}</span>
          </div>
          <div class="row-mid">
            <span class="prop-name">${l.prop_label}</span>
            <span class="stat-nums">${l.sub_stat}</span>
          </div>
          <div class="bar-container">
            <div class="bar-track">
              <div class="bar-fill fill-${l.status}" style="width: ${pctNum}%"></div>
              <div class="bar-knob knob-${l.status}" style="left: ${knobPos}%">${l.current}</div>
            </div>
            <div class="bar-target ${l.status === 'hit' ? 'target-hit' : ''}">${l.target}</div>
          </div>
        </div>
      `;
    }).join('');
  }
}

render();
pollESPN();
setInterval(pollESPN, 15000);
</script>
